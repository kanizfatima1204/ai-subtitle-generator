[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:ai-service]
directory=/app/ai-service
command=/app/ai-service-venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 --timeout-keep-alive 300
autostart=true
autorestart=true
startsecs=3
startretries=100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
directory=/app/backend
command=php artisan queue:work --sleep=3 --tries=3 --max-time=7200 --timeout=3900
autostart=true
autorestart=true
startretries=100
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-web]
directory=/app/backend
command=bash -c "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
