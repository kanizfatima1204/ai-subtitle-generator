[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:ai-service]
directory=/app/ai-service
command=/app/ai-service-venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --timeout-keep-alive 120
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
directory=/app/backend
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=1800
autostart=true
autorestart=true
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-web]
directory=/app/backend
command=bash -c "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
